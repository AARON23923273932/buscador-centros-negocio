<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Buscador de centros de negocio y órdenes de compra o servicio." />
    <!-- Archivos desde la raíz ("/…"), no relativos: la app tiene rutas anidadas (/centros/A2338PY01). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Buscador de centros de negocio</title>
    <!-- Aplica el modo claro/oscuro elegido antes de pintar la página (evita un parpadeo). -->
    <script src="/tema-inicial.js"></script>
  </head>
  <body>
    <!--
      La aplicación (React) se dibuja dentro de #raiz: ver src/main.tsx y src/App.tsx.
      Lo de adentro es lo que se ve mientras se descarga el código: es IGUAL a lo primero que dibuja
      React (cabecera + "Cargando…"), así la página no "salta" cuando React lo reemplaza.
      Si se cambia la cabecera o la pantalla de carga, cambiar también esto (lo revisa
      tests/unit/pagina-inicial.test.tsx).
    -->
    <div id="raiz">
      <a class="saltar sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:rounded-md focus:bg-primary focus:px-3 focus:py-2 focus:text-primary-foreground" href="#buscador">Saltar al buscador</a>
      <header class="cabecera border-b-2 border-primary bg-card print:hidden">
        <div class="columna flex flex-wrap items-center justify-between gap-x-4 gap-y-2 py-3 max-escritorio:py-2.5">
          <div class="flex min-w-0 items-center gap-3">
            <span class="logo grid size-10 flex-none place-items-center rounded-lg bg-primary text-primary-foreground" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" class="block">
                <path fill="currentColor" d="M3 3h8v8H3V3Zm2 2v4h4V5H5Zm8-2h8v8h-8V3Zm2 2v4h4V5h-4ZM3 13h8v8H3v-8Zm2 2v4h4v-4H5Zm13-2h2v3h3v2h-3v3h-2v-3h-3v-2h3v-3Z"></path>
              </svg>
            </span>
            <div class="min-w-0">
              <h1 id="titulo-app" class="m-0 text-xl">Buscador de centros de negocio</h1>
              <p id="subtitulo-app" class="m-0 text-sm text-muted-foreground max-escritorio:hidden">Centros de negocio y sus órdenes de compra / servicio</p>
            </div>
          </div>
          <div class="ml-auto flex min-w-0 items-center gap-3">
            <div id="zona-usuario" class="flex min-w-0 items-center gap-3" hidden>
              <span data-slot="badge" data-variant="outline" class="inline-flex w-fit shrink-0 items-center justify-center gap-1 overflow-hidden rounded-full border font-bold whitespace-nowrap [&amp;>svg]:pointer-events-none [&amp;>svg]:size-3 border-primary bg-card text-enlace px-2.5 py-1 text-[0.8rem]" id="insignia-demo" hidden>Modo demostración</span>
              <div id="datos-usuario" class="flex min-w-0 items-center gap-2.5" hidden>
                <span id="iniciales-usuario" class="grid size-[34px] flex-none place-items-center rounded-full bg-secondary text-sm font-bold text-secondary-foreground" aria-hidden="true"></span>
                <span class="flex min-w-0 flex-col leading-tight max-escritorio:hidden">
                  <span id="nombre-usuario" class="text-sm font-semibold"></span>
                  <span id="correo-usuario" class="max-w-[260px] truncate text-xs text-muted-foreground"></span>
                </span>
                <button data-slot="button" data-variant="outline" data-size="sm" class="group/button inline-flex shrink-0 items-center justify-center rounded-md border font-medium whitespace-nowrap no-underline select-none disabled:pointer-events-none disabled:border-desactivado-borde disabled:bg-desactivado disabled:text-desactivado-texto aria-disabled:cursor-not-allowed aria-disabled:border-desactivado-borde aria-disabled:bg-desactivado aria-disabled:text-desactivado-texto [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 foco-control border-input bg-card text-foreground hover:bg-accent hover:text-accent-foreground hover:not-focus-visible:border-primary h-8 gap-1 px-2.5 text-sm" type="button" id="btn-cerrar-sesion">Cerrar sesión</button>
              </div>
            </div>
            <button data-slot="tooltip-trigger" data-variant="outline" data-size="icon" class="group/button inline-flex items-center justify-center gap-1.5 border leading-tight font-medium whitespace-nowrap no-underline select-none disabled:pointer-events-none disabled:border-desactivado-borde disabled:bg-desactivado disabled:text-desactivado-texto aria-disabled:cursor-not-allowed aria-disabled:border-desactivado-borde aria-disabled:bg-desactivado aria-disabled:text-desactivado-texto [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 [&amp;_svg:not([class*='size-'])]:size-4 foco-control border-input bg-card text-foreground hover:bg-accent hover:text-accent-foreground hover:not-focus-visible:border-primary size-9 flex-none rounded-full" type="button" id="btn-tema" aria-label="Cambiar a modo oscuro" data-state="closed">
              <svg class="icono-luna block size-[18px] shrink-0 in-data-[tema-efectivo=oscuro]:hidden" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                <path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3a.5.5 0 0 0-.6-.6A9.5 9.5 0 1 0 21.6 15.1a.5.5 0 0 0-.6-.6Z"></path>
              </svg>
              <svg class="icono-sol hidden size-[18px] shrink-0 in-data-[tema-efectivo=oscuro]:block" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path>
              </svg>
            </button>
          </div>
        </div>
      </header>
      <main id="principal" class="columna pt-5 pb-4 max-escritorio:pt-3 max-escritorio:pb-3">
        <section id="pantalla-carga" class="grid min-h-[60vh] place-items-center" aria-live="polite">
          <div data-slot="card" class="rounded-lg border border-border bg-card p-6 text-card-foreground tarjeta-centro w-full max-w-[480px] text-center">
            <span class="inline-block size-[22px] shrink-0 animate-spin rounded-full border-3 border-border border-t-primary align-middle" aria-hidden="true"></span>
            <p class="mt-3 mb-0">Cargando…</p>
          </div>
        </section>
      </main>
      <div id="aviso-flotante" class="aviso-flotante pointer-events-none fixed bottom-5 left-1/2 z-50 max-w-[calc(100vw-32px)] -translate-x-1/2 translate-y-5 rounded-md bg-foreground px-4 py-2.5 text-sm text-card opacity-0 transition-[translate] duration-200" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
