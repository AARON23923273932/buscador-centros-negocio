<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Buscador de centros de negocio y órdenes de compra o servicio." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Buscador de centros de negocio</title>
    <!-- Aplica el modo claro/oscuro elegido antes de pintar la página (evita un parpadeo). -->
    <script src="tema-inicial.js"></script>
  </head>
  <body>
    <!--
      La aplicación (React) se dibuja dentro de #raiz: ver src/main.tsx y src/App.tsx.
      Lo de adentro es lo que se ve mientras se descarga el código: es IGUAL a lo primero que dibuja
      React (cabecera + "Cargando…"), así la página no "salta" cuando React lo reemplaza.
      Si se cambia la cabecera o la pantalla de carga, cambiar también esto (lo revisa
      tests/unit/pagina-inicial.test.tsx).
    -->
    <div id="raiz">
      <a class="saltar" href="#buscador">Saltar al buscador</a>
      <header class="cabecera">
        <div class="cabecera-interior">
          <div class="marca">
            <span class="logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 3h8v8H3V3Zm2 2v4h4V5H5Zm8-2h8v8h-8V3Zm2 2v4h4V5h-4ZM3 13h8v8H3v-8Zm2 2v4h4v-4H5Zm13-2h2v3h3v2h-3v3h-2v-3h-3v-2h3v-3Z" /></svg>
            </span>
            <div class="marca-textos">
              <h1 id="titulo-app">Buscador de centros de negocio</h1>
              <p id="subtitulo-app" class="subtitulo">Centros de negocio y sus órdenes de compra / servicio</p>
            </div>
          </div>
          <div class="cabecera-acciones">
            <div id="zona-usuario" class="zona-usuario" hidden>
              <span id="insignia-demo" class="insignia-demo" hidden>Modo demostración</span>
              <div id="datos-usuario" class="datos-usuario" hidden>
                <span id="iniciales-usuario" class="avatar" aria-hidden="true"></span>
                <span class="usuario-textos">
                  <span id="nombre-usuario" class="usuario-nombre"></span>
                  <span id="correo-usuario" class="usuario-correo"></span>
                </span>
                <button type="button" id="btn-cerrar-sesion" class="btn btn-secundario btn-pequeno">Cerrar sesión</button>
              </div>
            </div>
            <button type="button" id="btn-tema" class="btn-tema" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
              <svg class="icono-luna" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3a.5.5 0 0 0-.6-.6A9.5 9.5 0 1 0 21.6 15.1a.5.5 0 0 0-.6-.6Z" /></svg>
              <svg class="icono-sol" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.5" fill="currentColor" /><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" /></svg>
            </button>
          </div>
        </div>
      </header>
      <main id="principal" class="principal">
        <section id="pantalla-carga" class="pantalla-centro" aria-live="polite">
          <div class="tarjeta tarjeta-centro">
            <span class="spinner" aria-hidden="true"></span>
            <p>Cargando…</p>
          </div>
        </section>
      </main>
      <div id="aviso-flotante" class="aviso-flotante" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
