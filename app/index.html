<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Buscador de centros de negocio y órdenes de compra o servicio." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Buscador de centros de negocio</title>
    <!-- Aplica el modo claro/oscuro elegido antes de pintar la página (evita un parpadeo). -->
    <script src="tema-inicial.js"></script>
  </head>
  <body>
    <!--
      La aplicación (React) se dibuja dentro de #raiz: ver src/main.tsx y src/App.tsx.
      Lo de adentro es solo lo que se ve mientras se descarga el código; React lo reemplaza.
    -->
    <div id="raiz">
      <main class="principal">
        <section class="pantalla-centro" aria-live="polite">
          <div class="tarjeta tarjeta-centro">
            <span class="spinner" aria-hidden="true"></span>
            <p>Cargando…</p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
